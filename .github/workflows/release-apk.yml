name: Release APK

# Runs only when you ask: push a tag named release-<anything>
# (git tag release-12 && git push origin release-12), or press Run workflow on
# the Actions tab. Ordinary pushes never build or spend minutes.
# Builds a signed release APK pointed at the Vercel backend and publishes it to
# Vercel Blob for the in-app updater (Settings -> App update, and a check at
# launch). Actions are pinned to exact commits and the token is read-only.
on:
  workflow_dispatch:
  push:
    tags: ['release-*']

# Least privilege: nothing here needs to write to the repository.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.29.0'
          channel: stable
          cache: true

      - name: Restore signing + Firebase files from secrets
        run: |
          echo "$KEYSTORE_B64" | base64 -d > android/app/release.jks
          echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=release.jks
          EOF
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}

      # android/gradle.properties pins a Windows JDK path for local builds;
      # drop it on the Linux runner so Gradle uses the JDK set up above.
      - run: sed -i '/^org.gradle.java.home/d' android/gradle.properties

      - run: flutter pub get

      # +1000 keeps every CI build's versionCode above any local/debug build (those
      # are 1) and above the 100+n builds an earlier repo published, so the in-app
      # updater always sees it as newer.
      - run: echo "BUILD_NUMBER=$((1000 + ${{ github.run_number }}))" >> "$GITHUB_ENV"

      - name: Build
        run: |
          test -n "$BASE_URL" || { echo "::error::Add the BASE_URL repository secret (the backend address)"; exit 1; }
          flutter build apk --release --build-number=$BUILD_NUMBER --dart-define=BASE_URL="$BASE_URL"
        env:
          BASE_URL: ${{ secrets.BASE_URL }}

      # Keep the built APK on the run page for 3 days, so a failed upload later
      # doesn't waste the ~15 minute build.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 3

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Publish for the in-app updater
        run: |
          pip install vercel==0.11.3
          python .github/scripts/publish_apk.py build/app/outputs/flutter-apk/app-release.apk "$BUILD_NUMBER"
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
